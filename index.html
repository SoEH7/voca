<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>클린 화이트 영단어 학습장 (100 어휘)</title>
  <style>
    :root {
      --bg-color: #f8fafc;
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --primary-light: #eff6ff;
      --success: #10b981;
      --danger: #ef4444;
      --border-color: #e2e8f0;
      --shadow-sm: 0 1px 3px rgba(0,0,0,0.05);
      --shadow-md: 0 4px 6px -1px rgba(0,0,0,0.07);
      --shadow-lg: 0 10px 15px -3px rgba(0,0,0,0.08);
      --star-color: #f59e0b;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    body { background-color: var(--bg-color); color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; align-items: center; }

    header { width: 100%; max-width: 900px; padding: 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-color); background: #fff; }
    h1 { font-size: 1.3rem; font-weight: 700; color: var(--text-main); display: flex; align-items: center; gap: 8px; }

    .header-badges { display: flex; gap: 8px; }
    .badge { padding: 6px 12px; border-radius: 20px; font-size: 0.85rem; font-weight: 600; cursor: pointer; transition: all 0.2s; border: 1px solid var(--border-color); }
    .badge-star { background: #fffbeb; color: #b45309; border-color: #fde68a; }
    .badge-star:hover { background: #fef3c7; }
    .badge-wrong { background: #fef2f2; color: #b91c1c; border-color: #fecaca; }
    .badge-wrong:hover { background: #fee2e2; }

    nav { width: 100%; max-width: 900px; padding: 12px 20px; display: flex; gap: 8px; overflow-x: auto; background: #fff; border-bottom: 1px solid var(--border-color); }
    .nav-btn { padding: 10px 18px; border: 1px solid var(--border-color); background: #fff; color: var(--text-muted); border-radius: 8px; font-size: 0.9rem; font-weight: 600; cursor: pointer; white-space: nowrap; transition: all 0.2s; }
    .nav-btn:hover { background: var(--bg-color); }
    .nav-btn.active { background: var(--primary); color: #fff; border-color: var(--primary); }

    .filter-bar { width: 100%; max-width: 900px; padding: 12px 20px; display: flex; gap: 8px; overflow-x: auto; background: var(--bg-color); align-items: center; }
    .filter-btn { padding: 6px 14px; border: 1px solid var(--border-color); background: #fff; color: var(--text-muted); border-radius: 20px; font-size: 0.85rem; font-weight: 600; cursor: pointer; white-space: nowrap; transition: all 0.2s; }
    .filter-btn:hover { background: #f1f5f9; }
    .filter-btn.active { background: var(--text-main); color: #fff; border-color: var(--text-main); }
    .filter-btn.star-filter.active { background: #b45309; border-color: #b45309; }
    .filter-btn.wrong-filter.active { background: #b91c1c; border-color: #b91c1c; }

    main { width: 100%; max-width: 900px; padding: 20px; flex: 1; display: flex; flex-direction: column; align-items: center; }

    .progress-bar-container { width: 100%; height: 6px; background: var(--border-color); border-radius: 3px; margin-bottom: 20px; overflow: hidden; }
    .progress-bar { height: 100%; background: var(--primary); width: 0%; transition: width 0.3s ease; }

    .toggle-group { display: flex; align-items: center; gap: 8px; font-size: 0.85rem; font-weight: 600; color: var(--text-muted); margin-bottom: 16px; cursor: pointer; }
    .toggle-group input { cursor: pointer; width: 16px; height: 16px; }

    /* Flashcard */
    .flashcard-container { width: 100%; max-width: 500px; height: 320px; perspective: 1000px; cursor: pointer; margin-top: 4px; }
    .flashcard { width: 100%; height: 100%; position: relative; transform-style: preserve-3d; transition: transform 0.4s ease; border-radius: 16px; box-shadow: var(--shadow-lg); }
    .flashcard.flipped { transform: rotateY(180deg); }
    .card-face { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; border-radius: 16px; border: 1px solid var(--border-color); background: #fff; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 28px; text-align: center; }
    
    .card-front { color: var(--text-main); }
    .card-back { transform: rotateY(180deg); background: #ffffff; border: 2px solid var(--primary-light); }

    .card-word { font-size: 2.3rem; font-weight: 700; margin-bottom: 12px; color: var(--text-main); }
    .card-meaning-box { background: var(--primary-light); padding: 14px 20px; border-radius: 10px; width: 100%; margin-bottom: 14px; }
    .card-meaning { font-size: 1.35rem; font-weight: 700; color: var(--primary); }
    .card-example { font-size: 0.95rem; color: var(--text-muted); line-height: 1.4; word-break: keep-all; }

    .card-actions { position: absolute; top: 16px; right: 16px; display: flex; gap: 8px; z-index: 10; }
    .icon-btn { background: none; border: none; font-size: 1.25rem; cursor: pointer; color: var(--text-muted); padding: 4px; transition: transform 0.1s; }
    .icon-btn:active { transform: scale(1.15); }
    .icon-btn.starred { color: var(--star-color); }

    .controls { display: flex; gap: 16px; margin-top: 24px; align-items: center; }
    .ctrl-btn { padding: 10px 22px; border: 1px solid var(--border-color); background: #fff; border-radius: 8px; font-weight: 600; cursor: pointer; box-shadow: var(--shadow-sm); transition: all 0.2s; }
    .ctrl-btn:hover { background: #f1f5f9; }

    /* Quiz Modes */
    .quiz-container { width: 100%; max-width: 550px; background: #fff; border-radius: 16px; border: 1px solid var(--border-color); padding: 28px; box-shadow: var(--shadow-md); }
    .quiz-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .quiz-question { font-size: 1.7rem; font-weight: 700; text-align: center; margin: 20px 0; min-height: 60px; display: flex; align-items: center; justify-content: center; }
    
    .options-grid { display: grid; grid-template-columns: 1fr; gap: 10px; margin-top: 20px; }
    .option-btn { padding: 14px 18px; border: 1px solid var(--border-color); background: #fff; border-radius: 10px; text-align: left; font-size: 1rem; font-weight: 500; cursor: pointer; transition: all 0.15s; }
    .option-btn:hover { background: var(--bg-color); }
    .option-btn.correct { background: #dcfce7 !important; border-color: #86efac !important; color: #166534 !important; font-weight: 700; }
    .option-btn.wrong { background: #fee2e2 !important; border-color: #fca5a5 !important; color: #991b1b !important; }

    .subjective-input-group { display: flex; gap: 8px; margin-top: 20px; }
    .subjective-input { flex: 1; padding: 12px 16px; border: 1px solid var(--border-color); border-radius: 8px; font-size: 1.1rem; outline: none; }
    .subjective-input:focus { border-color: var(--primary); }
    .submit-btn { padding: 12px 20px; background: var(--primary); color: #fff; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; }

    .feedback-box { margin-top: 16px; padding: 12px; border-radius: 8px; text-align: center; font-weight: 600; display: none; }
    .feedback-box.correct { background: #dcfce7; color: #166534; display: block; }
    .feedback-box.wrong { background: #fee2e2; color: #991b1b; display: block; }

    /* Wordlist Mode */
    .wordlist-container { width: 100%; max-width: 800px; background: #fff; border-radius: 12px; border: 1px solid var(--border-color); padding: 20px; box-shadow: var(--shadow-sm); }
    .wordlist-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .search-bar { width: 100%; padding: 12px 16px; border: 1px solid var(--border-color); border-radius: 8px; font-size: 0.95rem; margin-bottom: 12px; outline: none; }
    .search-bar:focus { border-color: var(--primary); }
    .word-item { display: flex; align-items: center; justify-content: space-between; padding: 14px 8px; border-bottom: 1px solid var(--border-color); }
    .word-item:last-child { border-bottom: none; }
    .word-info { flex: 1; }
    .word-en { font-weight: 700; font-size: 1.1rem; }
    .word-kr { color: var(--text-muted); font-size: 0.92rem; margin-top: 2px; }
    .word-ex { font-size: 0.85rem; color: #94a3b8; margin-top: 4px; }

    .clear-wrong-btn { padding: 6px 12px; background: #fee2e2; color: #991b1b; border: 1px solid #fca5a5; border-radius: 6px; font-size: 0.8rem; font-weight: 600; cursor: pointer; }
    .clear-wrong-btn:hover { background: #fecaca; }

    .next-quiz-btn { width: 100%; margin-top: 16px; padding: 12px; background: var(--primary); color: #fff; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; display: none; }
  </style>
</head>
<body>

  <header>
    <h1>📚 어휘 학습장</h1>
    <div class="header-badges">
      <div class="badge badge-star" id="star-count-badge" onclick="setFilter('star')">★ 별표: 0</div>
      <div class="badge badge-wrong" id="wrong-count-badge" onclick="setFilter('wrong')">오답 노트: 0</div>
    </div>
  </header>

  <nav>
    <button class="nav-btn active" onclick="switchMode('flashcard')">카드 학습</button>
    <button class="nav-btn" onclick="switchMode('choice')">객관식 퀴즈</button>
    <button class="nav-btn" onclick="switchMode('subjective')">주관식 퀴즈</button>
    <button class="nav-btn" onclick="switchMode('wordlist')">전체 단어장</button>
  </nav>

  <div class="filter-bar">
    <button class="filter-btn active" onclick="setFilter('all')">전체 (100)</button>
    <button class="filter-btn" onclick="setFilter(1)">Set 1 (1~20)</button>
    <button class="filter-btn" onclick="setFilter(2)">Set 2 (21~40)</button>
    <button class="filter-btn" onclick="setFilter(3)">Set 3 (41~60)</button>
    <button class="filter-btn" onclick="setFilter(4)">Set 4 (61~80)</button>
    <button class="filter-btn" onclick="setFilter(5)">Set 5 (81~100)</button>
    <button class="filter-btn star-filter" onclick="setFilter('star')">★ 별표</button>
    <button class="filter-btn wrong-filter" onclick="setFilter('wrong')">오답 노트</button>
  </div>

  <main>
    <div class="progress-bar-container">
      <div class="progress-bar" id="progress-bar"></div>
    </div>

    <!-- 1. Flashcard Mode -->
    <div id="mode-flashcard" class="mode-view" style="width: 100%; display: flex; flex-direction: column; align-items: center;">
      <label class="toggle-group">
        <input type="checkbox" id="auto-tts-toggle"> 카드 이동 시 발음 자동 재생
      </label>

      <div class="flashcard-container" onclick="flipCard()">
        <div class="flashcard" id="flashcard">
          <div class="card-face card-front">
            <div class="card-actions">
              <button class="icon-btn" id="fc-tts" onclick="event.stopPropagation(); speakCurrentWord();">🔊</button>
              <button class="icon-btn" id="fc-star" onclick="event.stopPropagation(); toggleStarCurrent();">★</button>
            </div>
            <div class="card-word" id="fc-word">accelerate</div>
            <div style="font-size: 0.85rem; color: var(--text-muted);">(클릭하여 뜻 확인)</div>
          </div>
          <div class="card-face card-back">
            <div class="card-meaning-box">
              <div class="card-meaning" id="fc-meaning">속도를 높이다</div>
            </div>
            <div class="card-example" id="fc-example"></div>
          </div>
        </div>
      </div>
      <div class="controls">
        <button class="ctrl-btn" onclick="prevCard()">◀ 이전</button>
        <span id="fc-index" style="font-weight: 600;">1 / 100</span>
        <button class="ctrl-btn" onclick="nextCard()">다음 ▶</button>
      </div>
    </div>

    <!-- 2. Choice Mode -->
    <div id="mode-choice" class="mode-view" style="display: none; width: 100%; flex-direction: column; align-items: center;">
      <div class="quiz-container">
        <div class="quiz-header">
          <span id="choice-progress" style="font-size: 0.85rem; color: var(--text-muted);">문제 1 / 100</span>
          <button class="icon-btn" id="choice-tts" onclick="speakCurrentQuizWord()">🔊</button>
        </div>
        <div class="quiz-question" id="choice-question">accelerate</div>
        <div class="options-grid" id="choice-options"></div>
        <div class="feedback-box" id="choice-feedback"></div>
        <button class="next-quiz-btn" id="choice-next-btn" onclick="nextChoiceQuiz()">다음 문제 ▶</button>
      </div>
    </div>

    <!-- 3. Subjective Mode -->
    <div id="mode-subjective" class="mode-view" style="display: none; width: 100%; flex-direction: column; align-items: center;">
      <div class="quiz-container">
        <div class="quiz-header">
          <span id="subj-progress" style="font-size: 0.85rem; color: var(--text-muted);">문제 1 / 100</span>
        </div>
        <div class="quiz-question" id="subj-question">속도를 높이다</div>
        
        <form onsubmit="event.preventDefault(); checkSubjectiveAnswer();">
          <div class="subjective-input-group">
            <input type="text" class="subjective-input" id="subj-input" placeholder="영단어를 입력하세요" autocomplete="off">
            <button type="submit" class="submit-btn">확인</button>
          </div>
        </form>
        <div class="feedback-box" id="subj-feedback"></div>
        <button class="next-quiz-btn" id="subj-next-btn" onclick="nextSubjectiveQuiz()">다음 문제 ▶</button>
      </div>
    </div>

    <!-- 4. Wordlist Mode -->
    <div id="mode-wordlist" class="mode-view" style="display: none; width: 100%; justify-content: center;">
      <div class="wordlist-container">
        <div class="wordlist-header" id="wordlist-header">
          <span style="font-weight: 700; font-size: 0.95rem;" id="wordlist-count">단어 목록</span>
          <button class="clear-wrong-btn" id="clear-wrong-btn" style="display: none;" onclick="clearAllWrong()">오답 전체 비우기</button>
        </div>
        <input type="text" class="search-bar" id="word-search" placeholder="단어 또는 뜻 검색..." oninput="renderWordlist()">
        <div id="wordlist-items"></div>
      </div>
    </div>
  </main>

      { id: 76, word: "generally", meaning: "일반적으로", example: "" },
      { id: 77, word: "highly", meaning: "매우", example: "highly recommended 강력히 추천되는" },
      { id: 78, word: "immediately", meaning: "즉시", example: "immediately after purchase 구매 직후에" },
      { id: 79, word: "increasingly", meaning: "점점", example: "become increasingly popular 점점 더 인기 있어 지다" },
      { id: 80, word: "intentionally", meaning: "고의로", example: "" },
      { id: 81, word: "jointly", meaning: "공동으로", example: "" },
      { id: 82, word: "later", meaning: "나중에", example: "no later than 늦어도~까지" },
      { id: 83, word: "noticeably", meaning: "눈에 띄게", example: "noticeably higher 눈에 띄게 더 높은" },
      { id: 84, word: "particularly", meaning: "특히", example: "" },
      { id: 85, word: "periodically", meaning: "정기적으로", example: "" },
      { id: 86, word: "predictably", meaning: "예상대로", example: "" },
      { id: 87, word: "previously", meaning: "이전에", example: "" },
      { id: 88, word: "primarily", meaning: "주로", example: "focus primarily on 주로 ~에 집중하다" },
      { id: 89, word: "promptly", meaning: "신속하게", example: "" },
      { id: 90, word: "rapidly", meaning: "빠르게", example: "grow rapidly 급속히 성장하다" },
      { id: 91, word: "reasonably", meaning: "합리적으로", example: "reasonably priced 합리적인 가격의" },
      { id: 92, word: "recently", meaning: "최근에", example: "" },
      { id: 93, word: "respectively", meaning: "각각", example: "receive 10 and 12 votes, respectively 각각 10, 12표를 받다" },
      { id: 94, word: "seamlessly", meaning: "매끄럽게", example: "" },
      { id: 95, word: "securely", meaning: "확실하게", example: "securely fastened 확실하게 고정된" },
      { id: 96, word: "slightly", meaning: "약간", example: "slightly different 약간 다른" },
      { id: 97, word: "solely", meaning: "오직", example: "based solely on ~에만 근거한" },
      { id: 98, word: "specifically", meaning: "특별히", example: "" },
      { id: 99, word: "steadily", meaning: "꾸준히", example: "rise steadily 꾸준히 증가하다" },
      { id: 100, word: "temporarily", meaning: "일시적으로", example: "be temporarily closed 일시적으로 닫히다" }
    ];

    let currentMode = 'flashcard';
    let currentFilter = 'all';
    let starredList = JSON.parse(localStorage.getItem('starredList')) || [];
    let wrongList = JSON.parse(localStorage.getItem('wrongList')) || [];

    let activeWords = [...rawData];
    let fcIndex = 0;
    let quizIndex = 0;

    function init() {
      updateBadges();
      applyFilter();
    }

    function updateBadges() {
      document.getElementById('star-count-badge').innerText = `★ 별표: ${starredList.length}`;
      document.getElementById('wrong-count-badge').innerText = `오답 노트: ${wrongList.length}`;
      localStorage.setItem('starredList', JSON.stringify(starredList));
      localStorage.setItem('wrongList', JSON.stringify(wrongList));
    }

    function setFilter(filterType) {
      currentFilter = filterType;
      const btns = document.querySelectorAll('.filter-btn');
      btns.forEach(btn => btn.classList.remove('active'));

      if (filterType === 'all') btns[0].classList.add('active');
      else if (typeof filterType === 'number') btns[filterType].classList.add('active');
      else if (filterType === 'star') btns[6].classList.add('active');
      else if (filterType === 'wrong') btns[7].classList.add('active');

      applyFilter();
    }

    function applyFilter() {
      if (currentFilter === 'all') {
        activeWords = [...rawData];
      } else if (currentFilter === 'star') {
        activeWords = rawData.filter(w => starredList.includes(w.id));
      } else if (currentFilter === 'wrong') {
        activeWords = rawData.filter(w => wrongList.includes(w.id));
      } else if (typeof currentFilter === 'number') {
        const start = (currentFilter - 1) * 20;
        const end = start + 20;
        activeWords = rawData.slice(start, end);
      }

      fcIndex = 0;
      quizIndex = 0;

      if (currentMode === 'flashcard') renderFlashcard();
      else if (currentMode === 'choice') renderChoiceQuiz();
      else if (currentMode === 'subjective') renderSubjectiveQuiz();
      else if (currentMode === 'wordlist') renderWordlist();
    }

    function switchMode(mode) {
      currentMode = mode;
      document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
      event.target.classList.add('active');

      document.querySelectorAll('.mode-view').forEach(view => view.style.display = 'none');
      document.getElementById(`mode-${mode}`).style.display = (mode === 'wordlist') ? 'block' : 'flex';

      applyFilter();
    }

    /* Flashcard Logic */
    function renderFlashcard() {
      const card = document.getElementById('flashcard');
      card.classList.remove('flipped');

      if (activeWords.length === 0) {
        document.getElementById('fc-word').innerText = "단어가 없습니다";
        document.getElementById('fc-meaning').innerText = "-";
        document.getElementById('fc-example').innerText = "";
        document.getElementById('fc-index').innerText = "0 / 0";
        return;
      }

      const item = activeWords[fcIndex];
      document.getElementById('fc-word').innerText = item.word;
      document.getElementById('fc-meaning').innerText = item.meaning;
      document.getElementById('fc-example').innerText = item.example ? `예문: ${item.example}` : "";
      document.getElementById('fc-index').innerText = `${fcIndex + 1} / ${activeWords.length}`;

      const starBtn = document.getElementById('fc-star');
      if (starredList.includes(item.id)) starBtn.classList.add('starred');
      else starBtn.classList.remove('starred');

      updateProgressBar(fcIndex + 1, activeWords.length);

      if (document.getElementById('auto-tts-toggle').checked) {
        speakCurrentWord();
      }
    }

    function flipCard() {
      if (activeWords.length === 0) return;
      document.getElementById('flashcard').classList.toggle('flipped');
    }

    function prevCard() {
      if (activeWords.length === 0) return;
      fcIndex = (fcIndex - 1 + activeWords.length) % activeWords.length;
      renderFlashcard();
    }

    function nextCard() {
      if (activeWords.length === 0) return;
      fcIndex = (fcIndex + 1) % activeWords.length;
      renderFlashcard();
    }

    function toggleStarCurrent() {
      if (activeWords.length === 0) return;
      const id = activeWords[fcIndex].id;
      if (starredList.includes(id)) {
        starredList = starredList.filter(item => item !== id);
      } else {
        starredList.push(id);
      }
      updateBadges();
      renderFlashcard();
    }

    function speakCurrentWord() {
      if (activeWords.length === 0) return;
      speakTTS(activeWords[fcIndex].word);
    }

    function speakTTS(text) {
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'en-US';
      window.speechSynthesis.speak(utterance);
    }

    /* Choice Quiz Logic */
    function renderChoiceQuiz() {
      const feedback = document.getElementById('choice-feedback');
      const nextBtn = document.getElementById('choice-next-btn');
      feedback.style.display = 'none';
      nextBtn.style.display = 'none';

      if (activeWords.length === 0) {
        document.getElementById('choice-question').innerText = "문제 데이터가 없습니다.";
        document.getElementById('choice-options').innerHTML = "";
        return;
      }

      const item = activeWords[quizIndex];
      document.getElementById('choice-progress').innerText = `문제 ${quizIndex + 1} / ${activeWords.length}`;
      document.getElementById('choice-question').innerText = item.word;

      let options = [item.meaning];
      while (options.length < 4) {
        const rand = rawData[Math.floor(Math.random() * rawData.length)].meaning;
        if (!options.includes(rand)) options.push(rand);
      }
      options.sort(() => Math.random() - 0.5);

      const grid = document.getElementById('choice-options');
      grid.innerHTML = "";
      options.forEach(opt => {
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.innerText = opt;
        btn.onclick = () => checkChoiceAnswer(btn, opt, item);
        grid.appendChild(btn);
      });

      updateProgressBar(quizIndex + 1, activeWords.length);
    }

    function checkChoiceAnswer(btn, selected, item) {
      const allBtns = document.querySelectorAll('.option-btn');
      allBtns.forEach(b => b.disabled = true);

      const feedback = document.getElementById('choice-feedback');
      const nextBtn = document.getElementById('choice-next-btn');

      if (selected === item.meaning) {
        btn.classList.add('correct');
        feedback.innerText = "정답입니다! 🎉";
        feedback.className = "feedback-box correct";
        wrongList = wrongList.filter(id => id !== item.id);
      } else {
        btn.classList.add('wrong');
        allBtns.forEach(b => {
          if (b.innerText === item.meaning) b.classList.add('correct');
        });
        feedback.innerText = `아쉽네요. 진짜 정답은 [ ${item.meaning} ] 입니다.`;
        feedback.className = "feedback-box wrong";
        if (!wrongList.includes(item.id)) wrongList.push(item.id);
      }

      updateBadges();
      nextBtn.style.display = 'block';
    }

    function nextChoiceQuiz() {
      quizIndex = (quizIndex + 1) % activeWords.length;
      renderChoiceQuiz();
    }

    function speakCurrentQuizWord() {
      if (activeWords.length === 0) return;
      speakTTS(activeWords[quizIndex].word);
    }

    /* Subjective Quiz Logic */
    function renderSubjectiveQuiz() {
      const feedback = document.getElementById('subj-feedback');
      const nextBtn = document.getElementById('subj-next-btn');
      const input = document.getElementById('subj-input');
      
      feedback.style.display = 'none';
      nextBtn.style.display = 'none';
      input.value = "";
      input.disabled = false;

      if (activeWords.length === 0) {
        document.getElementById('subj-question').innerText = "문제 데이터가 없습니다.";
        return;
      }

      const item = activeWords[quizIndex];
      document.getElementById('subj-progress').innerText = `문제 ${quizIndex + 1} / ${activeWords.length}`;
      document.getElementById('subj-question').innerText = item.meaning;

      updateProgressBar(quizIndex + 1, activeWords.length);
    }

    function checkSubjectiveAnswer() {
      const input = document.getElementById('subj-input');
      const answer = input.value.trim().toLowerCase();
      const item = activeWords[quizIndex];
      const target = item.word.toLowerCase();

      const feedback = document.getElementById('subj-feedback');
      const nextBtn = document.getElementById('subj-next-btn');

      input.disabled = true;

      if (answer === target) {
        feedback.innerText = "정답입니다! 🎉";
        feedback.className = "feedback-box correct";
        wrongList = wrongList.filter(id => id !== item.id);
      } else {
        feedback.innerText = `오답입니다. 진짜 정답: [ ${item.word} ]`;
        feedback.className = "feedback-box wrong";
        if (!wrongList.includes(item.id)) wrongList.push(item.id);
      }

      updateBadges();
      nextBtn.style.display = 'block';
    }

    function nextSubjectiveQuiz() {
      quizIndex = (quizIndex + 1) % activeWords.length;
      renderSubjectiveQuiz();
    }

    /* Wordlist Logic */
    function renderWordlist() {
      const container = document.getElementById('wordlist-items');
      const query = document.getElementById('word-search').value.toLowerCase();
      const clearBtn = document.getElementById('clear-wrong-btn');
      container.innerHTML = "";

      if (currentFilter === 'wrong') {
        clearBtn.style.display = 'inline-block';
      } else {
        clearBtn.style.display = 'none';
      }

      const filtered = activeWords.filter(w => 
        w.word.toLowerCase().includes(query) || w.meaning.includes(query)
      );

      document.getElementById('wordlist-count').innerText = `단어 목록 (${filtered.length}개)`;

      filtered.forEach(w => {
        const item = document.createElement('div');
        item.className = 'word-item';
        item.innerHTML = `
          <div class="word-info">
            <div class="word-en">${w.id}. ${w.word}</div>
            <div class="word-kr">${w.meaning}</div>
            ${w.example ? `<div class="word-ex">${w.example}</div>` : ''}
          </div>
          <div style="display: flex; gap: 4px; align-items: center;">
            <button class="icon-btn" onclick="speakTTS('${w.word}')">🔊</button>
            <button class="icon-btn ${starredList.includes(w.id) ? 'starred' : ''}" onclick="toggleStarList(${w.id})">★</button>
            ${wrongList.includes(w.id) ? `<button class="icon-btn" style="color: #ef4444; font-size: 1rem;" onclick="removeWrongItem(${w.id})" title="오답 노트에서 삭제">✕</button>` : ''}
          </div>
        `;
        container.appendChild(item);
      });
    }

    function toggleStarList(id) {
      if (starredList.includes(id)) {
        starredList = starredList.filter(item => item !== id);
      } else {
        starredList.push(id);
      }
      updateBadges();
      renderWordlist();
    }

    function removeWrongItem(id) {
      wrongList = wrongList.filter(item => item !== id);
      updateBadges();
      applyFilter();
    }

    function clearAllWrong() {
      if (confirm("오답 노트의 모든 단어를 삭제하시겠습니까?")) {
        wrongList = [];
        updateBadges();
        applyFilter();
      }
    }

    function updateProgressBar(current, total) {
      const bar = document.getElementById('progress-bar');
      const percent = total > 0 ? (current / total) * 100 : 0;
      bar.style.width = `${percent}%`;
    }

    /* Keyboard Shortcuts */
    document.addEventListener('keydown', (e) => {
      if (currentMode === 'flashcard') {
        if (e.key === 'ArrowLeft') prevCard();
        if (e.key === 'ArrowRight') nextCard();
        if (e.key === ' ') { e.preventDefault(); flipCard(); }
      }
    });

    init();
  </script>
</body>
</html>
